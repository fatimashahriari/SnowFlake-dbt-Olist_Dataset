olist_dbt_snowflake:

  target: dev        #Default Target

  outputs:

    dev:
      type: snowflake
      account: "{{ env_var('DBT_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      role: "{{ env_var('DBT_ROLE') }}"

      database: DBT_PROJECT
      warehouse: COMPUTE_WH
      schema: RAW
      threads: 4

    ci:
      type: snowflake
      account: "{{ env_var('DBT_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      role: "{{ env_var('DBT_ROLE') }}"

      database: DBT_PROJECT
      warehouse: COMPUTE_WH
      schema: CI
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('DBT_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      role: "{{ env_var('DBT_ROLE') }}"

      database: DBT_PROJECT
      warehouse: COMPUTE_WH
      schema: PRODUCTION
      threads: 4