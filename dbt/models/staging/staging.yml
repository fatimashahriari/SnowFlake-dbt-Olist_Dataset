version: 2

models:

  - name: stg_customers

    columns:

      - name: CUSTOMER_UNIQUE_ID
        tests:
          - not_null

  - name: stg_geolocation

    columns:

      - name: lat
        description: "Latitude of the postal code"
        tests:
          - not_null

      - name: lng
        description: "Longitude of the postal code"
        tests:
          - not_null

  - name: stg_order_items

    columns:

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: price
        tests:
          - not_null

  - name: stg_order_payments
    description: "Cleaned order payment records."

    columns:

      - name: order_id
        tests:
          - not_null

      - name: payment_type
        tests:
          - accepted_values:
              arguments:
                values:
                  - boleto
                  - debit_card
                  - not_defined
                  - credit_card
                  - voucher

      - name: payment_value
        tests:
          - not_null

  - name: stg_order_reviews

    columns:

      - name: review_id
        tests:
         - not_null

  - name: stg_products

    columns:

      - name: product_id
        tests:
         - not_null

  - name: stg_products_category_name

    columns:

      - name: product_category_name
        tests:
         - not_null

  - name: stg_sellers

    columns:

      - name: seller_id
        tests:
         - not_null

  - name: stg_orders
    description: "Cleaned and standardized orders data."

    columns:

      - name: order_id
        description: "Unique order identifier."
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved

